<!doctype html>
<!-- 页面测试：备份与恢复——导出的内容、日历默认不导出、坏文件整个拒绝、导入后整体替换。由 tests/e2e/run.mjs 运行。 -->
<meta charset="utf-8">
<body><iframe id="f" style="border:0;width:1440px;height:900px"></iframe><pre id="out"></pre>
<script>
const out = [];
const log = (ok, msg) => { out.push(`${ok ? 'PASS' : 'FAIL'} ${msg}`); document.getElementById('out').textContent = out.join('\n'); };
window.addEventListener('unhandledrejection', (e) => log(false, 'ERROR ' + e.reason));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
// 读文件、解码图片是真实的异步操作，无头模式的虚拟时间不等它们：页面空闲时会直接快进到结束。
// 请求挂起时虚拟时间会暂停，所以等待期间一直向测试服务器发一个 20ms 后才返回的请求，最多等 5 秒。
const waitFor = async (ok) => {
  for (let i = 0; i < 250 && !ok(); i++) await fetch('/__tick');
};
localStorage.clear();
localStorage.setItem('niwa:grid', JSON.stringify([
  { id: 'a', kind: 'link', name: 'A', url: 'https://a.example/', icon: { kind: 'image' }, x: 0, y: 0 },
  { id: 'b', kind: 'link', name: 'B', url: 'https://b.example/', icon: { kind: 'text', text: 'B', color: '#4f86c6' }, x: 1, y: 0 },
  { id: 'n', kind: 'widget', type: 'notes', size: 'm', x: 2, y: 0 },
]));
localStorage.setItem('niwa:icons', JSON.stringify({ a: 'data:image/webp;base64,AAAA' }));
localStorage.setItem('niwa:notes', JSON.stringify([{ id: '1', text: 'hello' }]));
localStorage.setItem('niwa:calendars', JSON.stringify([{ id: 'c', url: 'https://cal.example/x.ics', name: 'Cal', color: '#4f86c6' }]));
localStorage.setItem('niwa:engine', 'Bing');
localStorage.setItem('niwa:search-exclude', JSON.stringify(['secret.example']));
localStorage.setItem('niwa:weather-account', JSON.stringify({ host: 'h.re.qweatherapi.com', key: 'k' }));
localStorage.setItem('niwa:theme', 'dark');
localStorage.setItem('niwa:weather-city', JSON.stringify({ id: '101210101', name: '杭州', region: '浙江省', lat: 30.25, lon: 120.21 }));

let restored = false;
const f = document.getElementById('f');
f.src = '/newtab.html';
f.onload = async () => {
  await sleep(500);
  const w = f.contentWindow, d = f.contentDocument, ls = w.localStorage;
  if (restored) {
    const grid = JSON.parse(ls.getItem('niwa:grid'));
    log(grid.length === 3 && grid[0].icon.kind === 'image' && JSON.parse(ls.getItem('niwa:icons')).a === 'data:image/webp;base64,AAAA', 'layout and icons restored');
    log(JSON.parse(ls.getItem('niwa:notes'))[0]?.text === 'hello' && d.documentElement.dataset.theme === 'dark', 'notes and theme restored');
    log(JSON.parse(ls.getItem('niwa:weather-city'))?.name === '杭州', 'weather city restored');
    log(ls.getItem('niwa:calendars') === '[]' && JSON.parse(ls.getItem('niwa:weather-account'))?.host === 'other.re.qweatherapi.com', 'secrets kept when backup has none');
    return;
  }

  // 拦下导出时生成的文件
  // 只截下文件内容，不真的下载：否则每跑一次测试，都会往这台电脑的下载文件夹里存两份备份
  const click = w.HTMLAnchorElement.prototype.click;
  w.HTMLAnchorElement.prototype.click = function () { if (!this.download) click.call(this); };
  const blobs = [];
  const create = w.URL.createObjectURL.bind(w.URL);
  w.URL.createObjectURL = (blob) => { blobs.push(blob); return create(blob); };
  d.querySelector('[aria-label="备份与恢复"]').click(); await sleep(100);
  const dlg = d.querySelector('dialog[aria-labelledby="backup-title"]');
  const button = (text) => [...dlg.querySelectorAll('button')].find((b) => b.textContent.trim() === text);

  button('导出备份').click(); await sleep(100);
  const plain = JSON.parse(await blobs[0].text());
  log(plain.app === 'niwa' && plain.version === 4 && plain.data.grid.length === 3, 'export has layout');
  log(plain.data.icons.a === 'data:image/webp;base64,AAAA' && plain.data.notes[0].text === 'hello' && plain.data.theme === 'dark' && plain.data.engine === 'Bing' && plain.data.visits?.days === 1, 'export has icons, notes, prefs and visits');
  log(plain.data.weather?.name === '杭州', 'export has weather city');
  log(!('secrets' in plain.data) && !JSON.stringify(plain).includes('cal.example') && !JSON.stringify(plain).includes('qweatherapi') && !JSON.stringify(plain).includes('secret.example'), 'secrets not exported by default');
  dlg.querySelector('input[type=checkbox]').click(); await sleep(50);
  button('导出备份').click(); await sleep(100);
  const full = JSON.parse(await blobs[1].text());
  log(full.data.secrets?.calendars?.[0]?.url === 'https://cal.example/x.ics' && full.data.secrets?.weatherAccount?.key === 'k' && full.data.secrets?.searchExclude?.[0] === 'secret.example', 'secrets exported when checked');

  // 导入：坏文件整个拒绝
  const error = () => dlg.querySelector('.field-error')?.textContent ?? '';
  const pick = async (text) => {
    const dt = new w.DataTransfer();
    dt.items.add(new w.File([text], 'backup.json', { type: 'application/json' }));
    const input = dlg.querySelector('input[type=file]');
    input.files = dt.files;
    input.dispatchEvent(new w.Event('change', { bubbles: true }));
    // 先等读完这个文件，再看结果（上一个文件的结果可能还在）
    for (let i = 0; i < 5; i++) await fetch('/__tick');
    await waitFor(() => error() || dlg.querySelector('.backup-pending'));
  };
  await pick('not json');
  log(error() === '这不是 Niwa 的备份文件', `non-backup rejected: ${error()}`);
  await pick(JSON.stringify({ ...plain, version: 99 }));
  log(error().includes('更新版本'), `newer version rejected: ${error()}`);
  const dup = structuredClone(plain); dup.data.grid.push({ ...dup.data.grid[0] });
  await pick(JSON.stringify(dup));
  log(error().includes('有重复的格子') && !dlg.querySelector('.backup-pending'), `duplicate ids rejected: ${error()}`);
  const noImage = structuredClone(plain); noImage.data.icons = {};
  await pick(JSON.stringify(noImage));
  log(error().includes('缺少图标图片'), `missing image rejected: ${error()}`);

  // 第 1 版的备份（还没有天气）照样能导入
  const v1 = structuredClone(plain); v1.version = 1; delete v1.data.weather;
  await pick(JSON.stringify(v1));
  log(!error() && !!dlg.querySelector('.backup-pending'), `version 1 backup accepted: ${error()}`);
  // 第 2 版的日历放在 data.calendars：迁移成私密数据，只替换日历，天气 KEY 保持不变
  const v2 = structuredClone(full); v2.version = 2; v2.data.calendars = v2.data.secrets.calendars; delete v2.data.secrets;
  await pick(JSON.stringify(v2));
  const v2Text = dlg.querySelector('.backup-pending')?.textContent ?? '';
  log(!error() && v2Text.includes('日历订阅地址也会被替换') && v2Text.includes('天气 KEY、联想排除的网站保持不变'), `version 2 calendars migrated: ${error() || v2Text}`);
  const badSecret = structuredClone(full); badSecret.data.secrets.weatherAccount = { host: 1 };
  await pick(JSON.stringify(badSecret));
  log(error().includes('天气 KEY的数据不对'), `bad secret rejected: ${error()}`);

  // 模拟另一个浏览器：数据都不一样，再导入不带日历的备份
  ls.setItem('niwa:notes', '[]');
  ls.setItem('niwa:calendars', '[]');
  ls.setItem('niwa:weather-account', JSON.stringify({ host: 'other.re.qweatherapi.com', key: 'x' }));
  ls.setItem('niwa:theme', 'light');
  ls.removeItem('niwa:weather-city');
  await pick(JSON.stringify(plain));
  const summary = dlg.querySelector('.backup-pending')?.textContent ?? '';
  log(summary.includes('2 个快捷方式、1 个小组件、1 条便签') && summary.includes('日历订阅地址、天气 KEY、联想排除的网站保持不变') && !error(), `summary before replacing: ${summary}`);
  restored = true;
  button('替换当前数据').click();
};
</script>
