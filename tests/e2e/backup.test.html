<!doctype html>
<!-- 页面测试：备份与恢复——导出的内容、日历默认不导出、坏文件整个拒绝、导入后整体替换。由 tests/e2e/run.mjs 运行。 -->
<meta charset="utf-8">
<body><iframe id="f" style="border:0;width:1440px;height:900px"></iframe><pre id="out"></pre>
<script>
const out = [];
const log = (ok, msg) => { out.push(`${ok ? 'PASS' : 'FAIL'} ${msg}`); document.getElementById('out').textContent = out.join('\n'); };
window.addEventListener('unhandledrejection', (e) => log(false, 'ERROR ' + e.reason));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
// 读文件、解码图片是真实的异步操作，无头模式的虚拟时间不等它们：页面空闲时会直接快进到结束。
// 请求挂起时虚拟时间会暂停，所以等待期间一直向测试服务器发一个 20ms 后才返回的请求，最多等 5 秒。
const waitFor = async (ok) => {
  for (let i = 0; i < 250 && !ok(); i++) await fetch('/__tick');
};
localStorage.clear();
localStorage.setItem('niwa:grid', JSON.stringify([
  { id: 'a', kind: 'link', name: 'A', url: 'https://a.example/', icon: { kind: 'image' }, x: 0, y: 0 },
  { id: 'b', kind: 'link', name: 'B', url: 'https://b.example/', icon: { kind: 'text', text: 'B', color: '#4f86c6' }, x: 1, y: 0 },
  { id: 'n', kind: 'widget', type: 'notes', size: 'm', x: 2, y: 0, settings: { notes: [{ id: '1', text: 'hello' }] } },
]));
localStorage.setItem('niwa:icons', JSON.stringify({ a: 'data:image/webp;base64,AAAA' }));
// 一个订阅的日历，一个导入的文件（日历列表里 url 是 file:…，内容在 IndexedDB）
localStorage.setItem('niwa:calendars', JSON.stringify([{ id: 'c', url: 'https://cal.example/x.ics', name: 'Cal', color: '#4f86c6' }, { id: 'cf', url: 'file:x', name: '课程表', color: '#5aa469' }]));
localStorage.setItem('niwa:engine', 'Bing');
localStorage.setItem('niwa:engines', JSON.stringify([{ id: 'Bing', name: 'Bing', url: 'https://www.bing.com/search?q=%s' }, { id: 'e', name: 'Ecosia', url: 'https://www.ecosia.org/search?q=%s' }]));
localStorage.setItem('niwa:search-exclude', JSON.stringify(['secret.example']));
localStorage.setItem('niwa:weather-account', JSON.stringify({ host: 'h.re.qweatherapi.com', key: 'k' }));
localStorage.setItem('niwa:theme', 'dark');
const ICS = 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nX-WR-CALNAME:课程表\r\nEND:VCALENDAR';
// IndexedDB 和页面同源，测试页直接读写；也是真实的异步操作，用 waitFor 等
const idb = (mode, work) => new Promise((resolve, reject) => {
  const open = indexedDB.open('niwa', 1);
  open.onupgradeneeded = () => open.result.createObjectStore('calendar-files');
  open.onerror = () => reject(open.error);
  open.onsuccess = () => {
    const tx = open.result.transaction('calendar-files', mode);
    const req = work(tx.objectStore('calendar-files'));
    tx.oncomplete = () => { open.result.close(); resolve(req.result); };
    tx.onerror = () => reject(tx.error);
  };
});
const settle = async (promise) => { let done = false, value; promise.then((v) => { value = v; done = true; }); await waitFor(() => done); return value; };

// 0：导出、坏文件、导入不带私密信息的备份；1：重新加载后检查，再导入带私密信息的备份；2：检查日历文件换回来了
let stage = 0;
let fullText = '';
const f = document.getElementById('f');
settle(idb('readwrite', (s) => s.put(ICS, 'cf'))).then(() => { f.src = '/newtab.html'; });
f.onload = async () => {
  await sleep(500);
  const w = f.contentWindow, d = f.contentDocument, ls = w.localStorage;
  if (stage === 2) {
    const file = await settle(idb('readonly', (s) => s.get('cf')));
    log(JSON.parse(ls.getItem('niwa:calendars')).length === 2 && file === ICS, `calendar files restored: ${file}`);
    return;
  }
  if (stage === 1) {
    const grid = JSON.parse(ls.getItem('niwa:grid'));
    log(grid.length === 3 && grid[0].icon.kind === 'image' && JSON.parse(ls.getItem('niwa:icons')).a === 'data:image/webp;base64,AAAA', 'layout and icons restored');
    log(grid[2].settings?.notes?.[0]?.text === 'hello' && d.documentElement.dataset.theme === 'dark', 'notes and theme restored');
    log(ls.getItem('niwa:calendars') === '[]' && JSON.parse(ls.getItem('niwa:weather-account'))?.host === 'other.re.qweatherapi.com', 'secrets kept when backup has none');
    log((await settle(idb('readonly', (s) => s.get('cf')))) === ICS, 'calendar files kept when backup has none');
    // 再导入带私密信息的备份：IndexedDB 里的日历文件换回备份里的
    await settle(idb('readwrite', (s) => s.put('CHANGED', 'cf')));
    d.querySelector('[aria-label="设置"]').click(); await sleep(100);
    [...d.querySelectorAll('.setting')].find((x) => x.textContent.startsWith('备份与恢复')).querySelector('button').click(); await sleep(100);
    const dlg2 = d.querySelector('dialog[aria-labelledby="backup-title"]');
    const dt = new w.DataTransfer();
    dt.items.add(new w.File([fullText], 'backup.json', { type: 'application/json' }));
    const input = dlg2.querySelector('input[type=file]');
    input.files = dt.files;
    input.dispatchEvent(new w.Event('change', { bubbles: true }));
    await waitFor(() => dlg2.querySelector('.backup-pending'));
    stage = 2;
    [...dlg2.querySelectorAll('button')].find((b) => b.textContent.trim() === '替换当前数据').click();
    return;
  }

  // 拦下导出时生成的文件
  const blobs = [];
  const create = w.URL.createObjectURL.bind(w.URL);
  w.URL.createObjectURL = (blob) => { blobs.push(blob); return create(blob); };
  // 只截下文件内容，不真的下载：否则每跑一次测试，都会往这台电脑的下载文件夹里存两份备份
  const click = w.HTMLAnchorElement.prototype.click;
  w.HTMLAnchorElement.prototype.click = function () { if (!this.download) click.call(this); };
  // 备份在设置面板里
  d.querySelector('[aria-label="设置"]').click(); await sleep(100);
  [...d.querySelectorAll('.setting')].find((x) => x.textContent.startsWith('备份与恢复')).querySelector('button').click(); await sleep(100);
  const dlg = d.querySelector('dialog[aria-labelledby="backup-title"]');
  const button = (text) => [...dlg.querySelectorAll('button')].find((b) => b.textContent.trim() === text);

  button('导出备份').click(); await waitFor(() => blobs.length === 1);
  const plain = JSON.parse(await blobs[0].text());
  log(plain.app === 'niwa' && plain.version === 8 && plain.data.grid.length === 3 && !('addTile' in plain.data), 'export has layout');
  log(plain.data.icons.a === 'data:image/webp;base64,AAAA' && plain.data.grid[2].settings.notes[0].text === 'hello' && plain.data.theme === 'dark' && plain.data.engine === 'Bing' && plain.data.engines?.[1]?.name === 'Ecosia' && plain.data.visits?.days === 1, 'export has icons, notes, prefs and visits');
  log(!('secrets' in plain.data) && !JSON.stringify(plain).includes('cal.example') && !JSON.stringify(plain).includes('qweatherapi') && !JSON.stringify(plain).includes('secret.example'), 'secrets not exported by default');
  dlg.querySelector('input[type=checkbox]').click(); await sleep(50);
  button('导出备份').click(); await waitFor(() => blobs.length === 2);
  const full = JSON.parse(await blobs[1].text());
  fullText = JSON.stringify(full);
  log(full.data.secrets?.calendars?.[0]?.url === 'https://cal.example/x.ics' && full.data.secrets?.weatherAccount?.key === 'k' && full.data.secrets?.searchExclude?.[0] === 'secret.example', 'secrets exported when checked');
  log(full.data.secrets?.calendarFiles?.cf === ICS && !JSON.stringify(plain).includes('VCALENDAR'), 'calendar files exported only when checked');

  // 导入：坏文件整个拒绝
  const error = () => dlg.querySelector('.field-error')?.textContent ?? '';
  const pick = async (text) => {
    const dt = new w.DataTransfer();
    dt.items.add(new w.File([text], 'backup.json', { type: 'application/json' }));
    const input = dlg.querySelector('input[type=file]');
    input.files = dt.files;
    input.dispatchEvent(new w.Event('change', { bubbles: true }));
    // 先等读完这个文件，再看结果（上一个文件的结果可能还在）
    for (let i = 0; i < 5; i++) await fetch('/__tick');
    await waitFor(() => error() || dlg.querySelector('.backup-pending'));
  };
  await pick('not json');
  log(error() === '这不是 Niwa 的备份文件', `non-backup rejected: ${error()}`);
  await pick(JSON.stringify({ ...plain, version: 99 }));
  log(error().includes('更新版本'), `newer version rejected: ${error()}`);
  const dup = structuredClone(plain); dup.data.grid.push({ ...dup.data.grid[0] });
  await pick(JSON.stringify(dup));
  log(error().includes('有重复的格子') && !dlg.querySelector('.backup-pending'), `duplicate ids rejected: ${error()}`);
  const noImage = structuredClone(plain); noImage.data.icons = {};
  await pick(JSON.stringify(noImage));
  log(error().includes('缺少图标图片'), `missing image rejected: ${error()}`);

  // 收纳文件夹：里面的快捷方式也要有图标图片、id 不能和别的重复；摘要里写几个文件夹
  const withFolder = structuredClone(plain);
  const [first, ...rest] = withFolder.data.grid.filter((i) => i.kind === 'link');
  withFolder.data.grid = [...withFolder.data.grid.filter((i) => i.kind !== 'link'), { id: 'f1', kind: 'folder', name: '常用', links: [first, ...rest].map(({ x, y, ...l }) => l), x: 0, y: 0 }];
  await pick(JSON.stringify(withFolder));
  const folderText = dlg.querySelector('.backup-pending')?.textContent ?? '';
  log(!error() && folderText.includes(`${rest.length + 1} 个快捷方式、1 个文件夹`), `backup with folder accepted: ${error() || folderText}`);
  const folderNoImage = structuredClone(withFolder); folderNoImage.data.icons = {};
  await pick(JSON.stringify(folderNoImage));
  log(error().includes('缺少图标图片'), `missing image inside folder rejected: ${error()}`);
  const folderDup = structuredClone(withFolder); folderDup.data.grid[folderDup.data.grid.length - 1].links.push({ ...folderDup.data.grid[folderDup.data.grid.length - 1].links[0] });
  await pick(JSON.stringify(folderDup));
  log(error().includes('有重复的格子'), `duplicate id inside folder rejected: ${error()}`);

  // 第 1 版的备份（还没有天气）照样能导入
  const v1 = structuredClone(plain); v1.version = 1; delete v1.data.weather;
  await pick(JSON.stringify(v1));
  log(!error() && !!dlg.querySelector('.backup-pending'), `version 1 backup accepted: ${error()}`);
  // 第 2 版的日历放在 data.calendars：迁移成私密数据，只替换日历，天气 KEY 保持不变
  const v2 = structuredClone(full); v2.version = 2; v2.data.calendars = v2.data.secrets.calendars; delete v2.data.secrets;
  await pick(JSON.stringify(v2));
  const v2Text = dlg.querySelector('.backup-pending')?.textContent ?? '';
  log(!error() && v2Text.includes('日历订阅地址也会被替换') && v2Text.includes('天气 KEY、联想排除的网站保持不变'), `version 2 calendars migrated: ${error() || v2Text}`);
  // 第 5 版之前便签单独放在 data.notes：搬进便签小组件，没有便签小组件时补一个
  const v4 = structuredClone(plain); v4.version = 4; v4.data.grid = v4.data.grid.filter((i) => i.kind === 'link'); v4.data.notes = [{ id: 'x', text: 'a' }, { id: 'y', text: 'b' }];
  await pick(JSON.stringify(v4));
  const v4Text = dlg.querySelector('.backup-pending')?.textContent ?? '';
  log(!error() && v4Text.includes('1 个小组件、2 条便签'), `version 4 notes migrated: ${error() || v4Text}`);
  // 第 8 版之前有「添加」格子的位置（data.addTile）：不读，照样能导入
  const v7 = structuredClone(plain); v7.version = 7; v7.data.addTile = { x: 2, y: 1 }; delete v7.data.engines;
  await pick(JSON.stringify(v7));
  log(!error() && !!dlg.querySelector('.backup-pending'), `version 7 backup with addTile accepted: ${error()}`);
  const badSecret = structuredClone(full); badSecret.data.secrets.weatherAccount = { host: 1 };
  await pick(JSON.stringify(badSecret));
  log(error().includes('天气 KEY的数据不对'), `bad secret rejected: ${error()}`);

  // 模拟另一个浏览器：数据都不一样，再导入不带日历的备份
  ls.setItem('niwa:calendars', '[]');
  ls.setItem('niwa:weather-account', JSON.stringify({ host: 'other.re.qweatherapi.com', key: 'x' }));
  ls.setItem('niwa:theme', 'light');
  await pick(JSON.stringify(plain));
  const summary = dlg.querySelector('.backup-pending')?.textContent ?? '';
  log(summary.includes('2 个快捷方式、1 个小组件、1 条便签') && summary.includes('日历订阅地址、导入的日历文件、天气 KEY、联想排除的网站保持不变') && !error(), `summary before replacing: ${summary}`);
  stage = 1;
  button('替换当前数据').click();
};
</script>
